name: GitHub Pages

on:
  push:
    branches:
      - source-simple-daisy
  pull_request:
    branches:
      - source-simple-daisy
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Site
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # Tailwind CSS and its PostCSS plugins are required to build the theme.
      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Install Theme
        run: git clone --depth 1 --branch main https://github.com/mykonakona/simple-daisy.git themes/simple-daisy

      - name: Build Site
        run: npm run build -- --bail

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/source-simple-daisy'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./public
